name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run profile:validate
      - run: npm run profile:check
      - run: npm run test:run
      - run: npm run typecheck
      - run: npm run build
      - name: Verify static deployment artifacts
        run: |
          test -f apps/homepage/dist/index.html
          test -f apps/homepage/dist/projects/index.html
          test -f apps/homepage/dist/projects/alphascience/index.html
          test -f apps/homepage/dist/notes/index.html
          test -f apps/homepage/dist/notes/evidence-ledger-before-manuscript/index.html
          test -f apps/homepage/dist/notes/bounded-agent-execution/index.html
          test -f apps/homepage/dist/notes/selection-is-part-of-the-procedure/index.html
          test -f apps/homepage/dist/cv.html
          test -f apps/homepage/dist/files/CREST_2025_poster.pdf
          test -f apps/homepage/dist/media/hero.mp4
          test -f apps/homepage/dist/media/hero-poster.webp
          test -f apps/homepage/dist/og.png
          grep -Fq '/#full-cv' apps/homepage/dist/cv.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/homepage/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
